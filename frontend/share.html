<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Share to TRIBLI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/share.css">
</head>
<body>
<div class="share-shell">
  <header class="share-header">
    <a class="icon-button" href="/" aria-label="Back to feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a class="brand" href="/" aria-label="TRIBLI home"><span class="brand-glyph"></span><span>TRIBLI</span></a>
    <span></span>
  </header>
  <main class="share-main">
    <p class="eyebrow">Team intake</p>
    <h1>Share to TRIBLI</h1>
    <p class="intro">Paste a casting call or opportunity when WhatsApp did not pass its full caption or poster through the share sheet.</p>
    <form id="f" class="panel">
      <label class="field" for="text"><span class="field-label">Caption or message</span><textarea id="text" name="text" rows="8" placeholder="Paste the complete casting call, crew requirement, festival or grant…"></textarea><span class="field-help">Include the role, place, deadline and contact details when available.</span></label>
      <label class="field" for="url"><span class="field-label">Original link <span aria-hidden="true">·</span> optional</span><input id="url" name="url" type="url" inputmode="url" placeholder="https://…"></label>
      <label class="field" for="image"><span class="field-label">Poster screenshot <span aria-hidden="true">·</span> optional</span><input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></label>
      <div class="cta-frame"><button class="primary-button" id="submitBtn" type="submit">Send to TRIBLI</button></div>
      <p class="status" id="out" role="status" aria-live="polite"></p>
    </form>
    <div class="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.4v.1" stroke-linecap="round"/></svg><span>On Android, the normal flow is <strong>WhatsApp → Share → TRIBLI</strong>. This page is only the fallback.</span></div>
    <nav class="link-row" aria-label="Share help"><a href="/share/setup">Device setup</a><span>·</span><a href="/share/shortcut">iPhone Shortcut</a><span>·</span><a href="/">Feed</a></nav>
  </main>
</div>
<script>
const out=document.getElementById('out'),button=document.getElementById('submitBtn');
document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();button.disabled=true;button.textContent='Refining…';out.className='status';out.textContent='Checking and polishing this post…';try{const r=await fetch('/api/share',{method:'POST',body:new FormData(e.target),credentials:'same-origin'});if(r.status===401||r.status===403){out.className='status bad';out.innerHTML='This device is not connected. <a href="/share/setup">Set it up once</a>.';return}const j=await r.json();const ok=j.status==='published'||j.status==='duplicate';out.className='status '+(ok?'good':'bad');out.textContent=(ok?(j.status==='duplicate'?'Already in the feed. ':'Published to the team feed. '):'Not published. ')+(j.reasons||[]).join(' ');if(ok&&j.status==='published')e.target.reset()}catch(err){out.className='status bad';out.textContent='Could not reach TRIBLI. Check your connection and try again.'}finally{button.disabled=false;button.textContent='Send to TRIBLI'}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js');
</script>
</body>
</html>
